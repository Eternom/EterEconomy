# ============================================================
#  EterEconomy
# ============================================================
#
#  L'économie du réseau, fournie à Vault : tous les plugins (EterEssential pour
#  /money et /pay, EterTab pour la sidebar, boutiques...) passent par elle.
#  Base de données et Redis : EterLib/config.yml. Une seule commande, admin : /ecostats.
#  Les soldes sont en base (etereconomy_balances), commune à tous les serveurs.
#  Toute modification nécessite un redémarrage du serveur.

currency:
  # Nom de la monnaie : "1 Helok", "12 Heloks".
  name-singular: "Helok"
  name-plural: "Heloks"
  # Nombre de décimales (0 = nombres entiers seulement, 4 au maximum).
  # À ne pas changer une fois le serveur ouvert.
  fractional-digits: 0
  # Solde d'un joueur la première fois qu'il est vu.
  starting-balance: 0

# Comptes partagés de Vault (createBank, bankDeposit...), utilisés par d'autres plugins.
banks:
  enabled: true
  # Solde d'une banque à sa création.
  starting-balance: 0

# Journal de chaque mouvement d'argent (qui, combien, quel plugin), pour suivre l'équilibre
# de l'économie dans /ecostats.
history:
  # Le jour des statistiques change à minuit dans ce fuseau.
  time-zone: Europe/Paris
  # Durée de conservation des transactions, en jours (30 au minimum). Les plus anciennes sont
  # d'abord archivées dans plugins/EterEconomy/archives/ (CSV compressé), puis supprimées.
  # Les totaux par jour et l'évolution de la masse monétaire sont gardés pour toujours.
  retention-days: 365

# Menus : bouton en bas du menu. Avec une commande (sans le /), il la lance pour le joueur et relie
# les menus entre eux (ex : "profile" pour revenir au menu du profil) ; vide, il ferme le menu.
menus:
  stats:
    back-command: ""
