# ============================================================
#  EterEconomy
# ============================================================
#
#  L'économie du réseau, fournie à Vault : tous les plugins (EterEssential pour
#  /money et /pay, EterTab pour la sidebar, boutiques...) passent par elle.
#  Aucune commande ici. Base de données et Redis : EterLib/config.yml.
#  Les soldes sont en base (etereconomy_balances), commune à tous les serveurs.
#  Toute modification nécessite un redémarrage du serveur.

currency:
  # Nom de la monnaie : "1 Helok", "12 Heloks".
  name-singular: "Helok"
  name-plural: "Heloks"
  # Nombre de décimales (0 = nombres entiers seulement, 4 au maximum).
  # À ne pas changer une fois le serveur ouvert.
  fractional-digits: 0
  # Solde d'un joueur la première fois qu'il est vu.
  starting-balance: 0

# Comptes partagés de Vault (createBank, bankDeposit...), utilisés par d'autres plugins.
banks:
  enabled: true
  # Solde d'une banque à sa création.
  starting-balance: 0
