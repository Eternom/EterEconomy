# English messages for EterEconomy.
# "&" codes are translated to Minecraft colors, and every message has %prefix% available in
# addition to its own placeholders (listed in comments above each group below).

prefix: "&8[&6EterEconomy&8]&r "

no-permission: "%prefix%&cYou do not have permission to do this."
invalid-amount: "%prefix%&cThe amount must be a valid number."
negative-amount: "%prefix%&cThe amount must not be negative."
player-never-joined: "%prefix%&cThat player has never joined this server."
player-offline: "%prefix%&cThe specified player is not online."

# /eco - placeholders: %player%, %amount%, %balance%
eco-usage: "%prefix%&cUsage: /eco <give/set/take/reset/balance/top> <player> [amount]"
eco-usage-amount: "%prefix%&cUsage: /eco %sub% <player> <amount>"
eco-usage-balance: "%prefix%&cUsage: /eco balance <player>"
eco-unknown-subcommand: "%prefix%&cUnknown command. Usage: /eco <give/set/take/reset/balance/top> <player> [amount]"
eco-balance: "%prefix%&a%player%'s balance: &f%balance%"
eco-give: "%prefix%&aYou have given %amount% to %player%."
eco-set: "%prefix%&aYou have set the balance of %player% to %amount%."
eco-take: "%prefix%&aYou have taken %amount% from %player%."
eco-reset: "%prefix%&aYou have reset the balance of %player% to 0."
eco-top-empty: "%prefix%&eNo balances recorded yet."
eco-top-header: "%prefix%&6=== Top balances ==="
eco-top-entry: "&e#%rank% &f%player% &7- &a%balance%"
eco-insufficient-funds: "%prefix%&c%player% does not have enough money for that."
eco-amount-too-large: "%prefix%&cThe resulting balance would be too large."

# /bank - placeholders: %bank%, %player%, %amount%, %balance%, %banks%
bank-disabled: "%prefix%&cThe bank feature is disabled on this server."
bank-usage: "%prefix%&cUsage: /bank <create/delete/balance/deposit/withdraw/invite/kick/list> [args]"
bank-usage-create: "%prefix%&cUsage: /bank create <name>"
bank-usage-delete: "%prefix%&cUsage: /bank delete <name>"
bank-usage-balance: "%prefix%&cUsage: /bank balance <name>"
bank-usage-deposit: "%prefix%&cUsage: /bank deposit <name> <amount>"
bank-usage-withdraw: "%prefix%&cUsage: /bank withdraw <name> <amount>"
bank-usage-invite: "%prefix%&cUsage: /bank invite <name> <player>"
bank-usage-kick: "%prefix%&cUsage: /bank kick <name> <player>"
bank-unknown-subcommand: "%prefix%&cUnknown command. Usage: /bank <create/delete/balance/deposit/withdraw/invite/kick/list> [args]"
bank-only-player: "%prefix%&cOnly players can own a bank."
bank-already-exists: "%prefix%&cA bank with that name already exists."
bank-invalid-name: "%prefix%&cBank names may only contain letters, digits, '_' and '-', up to 32 characters."
bank-limit-reached: "%prefix%&cYou have reached the maximum number of banks you can own."
bank-not-found: "%prefix%&cNo such bank."
bank-insufficient-funds: "%prefix%&cThe bank does not have enough money."
bank-not-owner: "%prefix%&cThat player does not own this bank."
bank-not-member: "%prefix%&cThat player is not a member of this bank."
bank-amount-too-large: "%prefix%&cThe resulting balance would be too large."
bank-error: "%prefix%&cSomething went wrong with that bank operation."
bank-created: "%prefix%&aBank '%bank%' created."
bank-deleted: "%prefix%&aBank '%bank%' deleted."
bank-balance: "%prefix%&aBank '%bank%' balance: &f%balance%"
bank-deposit: "%prefix%&aDeposited %amount% into '%bank%'. New balance: %balance%"
bank-withdraw: "%prefix%&aWithdrew %amount% from '%bank%'. New balance: %balance%"
bank-member-added: "%prefix%&a%player% was added to '%bank%'."
bank-member-removed: "%prefix%&a%player% was removed from '%bank%'."
bank-list-empty: "%prefix%&eNo banks have been created yet."
bank-list-header: "%prefix%&6=== Banks ===&7 %banks%"
