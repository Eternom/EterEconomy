name: EterEconomy
version: '${version}'

main: fr.eternom.eterEconomy.Main
api-version: '26.2'
load: POSTWORLD
authors: [ NadTum, JanjeVuk ]
description: Économie du réseau (soldes, banques, journal), fournie à Vault. Commandes des joueurs dans EterEssential.
depend: [EterLib, Vault]

commands:
  ecostats:
    description: Tableau de bord de l'économie (masse monétaire, sources, plus riches).
    usage: /ecostats
    aliases: [economystats]
    permission: etereconomy.stats

  transactions:
    description: Les 15 derniers mouvements de ton argent.
    usage: /transactions
    permission: etereconomy.history

permissions:
  etereconomy.history:
    description: Voir ses derniers mouvements d'argent (/transactions).
    default: true
  etereconomy.alerts:
    description: Recevoir les alertes de gains anormaux.
    default: op
  etereconomy.stats:
    description: Voir le tableau de bord de l'économie (/ecostats).
    default: op
  etereconomy.admin:
    description: Toutes les permissions d'EterEconomy.
    default: op
    children:
      etereconomy.stats: true
      etereconomy.alerts: true
